<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">

<title>Calculadora SDOB - ENAEX</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  body { background: #111; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
  .container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 0 15px rgba(255,0,0,0.3); }
  .logo { text-align: center; margin-bottom: 15px; }
  .logo img { max-width: 180px; }
  h1 { text-align: center; color: #e30613; margin-bottom: 20px; }
  label { display: block; margin-top: 10px; font-weight: bold; }
  input { width: 100%; padding: 8px; margin-top: 5px; border-radius: 6px; border: none; background: #333; color: #fff; }
  .btn-group { display: flex; gap: 10px; margin-top: 15px; }
  button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
  .btn-calcular { background: #e30613; color: #fff; }
  .btn-limpar { background: #555; color: #fff; }
  .btn-pdf { background: #007bff; color: #fff; margin-top: 15px; width: 100%; }
  .result { margin-top: 20px; background: #222; padding: 15px; border-radius: 8px; }
</style>
</head>

  </div>
  <h1>Calculadora SDOB</h1>
  <form id="calcForm">
    <label>Diâmetro do Furo (mm)</label>
    <input type="number" id="diametro" value="270" required>

    <label>Afastamento B (m)</label>
    <input type="number" id="afastamento" value="8" step="0.1" required>

    <label>Espaçamento S (m)</label>
    <input type="number" id="espacamento" value="9" step="0.1" required>

    <label>Altura do Banco H (m)</label>
    <input type="number" id="altura" value="12" step="0.1" required>

    <label>Tampão T (m)</label>
    <input type="number" id="tampao" value="3" step="0.1" required>

    <label>Densidade da Rocha (t/m³)</label>
    <input type="number" id="densRocha" value="3.5" step="0.1" required>

    <label>Densidade do Explosivo (g/cm³)</label>
    <input type="number" id="densExpl" value="0.85" step="0.01" required>

    <div class="btn-group">
      <button type="submit" class="btn-calcular">Calcular</button>
      <button type="button" class="btn-limpar" onclick="limpar()">Limpar</button>
    </div>
  </form>

  <div class="result" id="resultado" style="display:none;"></div>
  <button class="btn-pdf" onclick="exportarPDF()" style="display:none;" id="btnPdf">Exportar PDF</button>
</div>

<script>
let dadosResultado = {};

document.getElementById('calcForm').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const d = parseFloat(document.getElementById('diametro').value);
  const B = parseFloat(document.getElementById('afastamento').value);
  const S = parseFloat(document.getElementById('espacamento').value);
  const H = parseFloat(document.getElementById('altura').value);
  const T = parseFloat(document.getElementById('tampao').value);
  const densRocha = parseFloat(document.getElementById('densRocha').value);
  const densExpl = parseFloat(document.getElementById('densExpl').value);

  const pol = (d / 25.4).toFixed(2);
  const comprimentoFuro = H;
  const comprimentoCarga = H - T;
  
  const cargaRocha = 0.785 * Math.pow(d/1000, 2) * densRocha;
  const cargaExpl = 0.785 * Math.pow(d/1000, 2) * densExpl * 1000;
  const carga = Math.min(cargaRocha, cargaExpl);
  
  const total = carga * comprimentoCarga;
  const cargaPorMetro = total / comprimentoFuro;
  const sdob = B / Math.pow(carga, 0.33);
  const lancamento = 8 * B;

  dadosResultado = {d, pol, B, S, H, comprimentoFuro, comprimentoCarga, carga, total, cargaPorMetro, sdob, lancamento};

  document.getElementById('resultado').innerHTML = `
    <h2>Resultados</h2>
    <p><b>Diâmetro:</b> ${d} mm = ${pol}"</p>
    <p><b>Malha:</b> ${B} x ${S} m</p>
    <p><b>Altura do Banco:</b> ${H} m</p>
    <p><b>Comprimento do Furo:</b> ${comprimentoFuro.toFixed(2)} m</p>
    <p><b>Comprimento de Carga:</b> ${comprimentoCarga.toFixed(2)} m</p>
    <hr>
    <p><b>Carga Estimada:</b> ${carga.toFixed(2)} kg/m</p>
    <p><b>Total por Furo:</b> ${total.toFixed(2)} kg</p>
    <p><b>Carga por Metro de Furo:</b> ${cargaPorMetro.toFixed(2)} kg/m</p>
    <p><b>SDOB:</b> ${sdob.toFixed(2)}</p>
    <p><b>Lançamento:</b> ${lancamento.toFixed(2)} m</p>
  `;
  document.getElementById('resultado').style.display = 'block';
  document.getElementById('btnPdf').style.display = 'block';
});

function limpar() {
  document.getElementById('calcForm').reset();
  document.getElementById('resultado').style.display = 'none';
  document.getElementById('btnPdf').style.display = 'none';
}
