<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Vale - Enaex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Calculadora Vale - Enaex</h1>
        <form id="calcForm">
            <label>Diâmetro do Furo (mm)</label>
            <input type="number" id="diametro" step="any" required>
            <label>Afastamento B (m)</label>
            <input type="number" id="afastamento" step="any" required>
            <label>Espaçamento S (m)</label>
            <input type="number" id="espacamento" step="any" required>
            <label>Altura do Banco H (m)</label>
            <input type="number" id="altura" step="any" required>
            <label>Tampão (m)</label>
            <input type="number" id="tampao" step="any" required>
            <button type="submit">Calcular</button>
        </form>
        <div id="resultado"></div>
    </div>
       <script src="calculadora.js"></script>
